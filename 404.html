<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>FOXREX — الصفحة غير موجودة</title>
<link rel="icon" href="/assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Inter:wght@800&display=swap" rel="stylesheet">
<style>
:root{--teal:#00D4A7;--ink:#0B1320;--text:#E5E7EB;--muted:rgba(229,231,235,.62);--faint:rgba(229,231,235,.12)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;text-align:center;background:radial-gradient(ellipse at 50% -10%,rgba(0,212,167,.14),transparent 55%),var(--ink);color:var(--text);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif}
.chip{display:inline-flex;background:#fff;border-radius:14px;padding:8px 12px;margin-bottom:26px}
.chip img{height:48px;display:block}
b{display:block;font-family:Inter,system-ui,sans-serif;font-weight:800;font-size:72px;line-height:1;color:var(--teal)}
h1{font-size:22px;margin:14px 0 8px}
p{color:var(--muted);margin:0 0 26px}
a.btn{display:inline-block;padding:12px 22px;border-radius:12px;background:var(--teal);color:#062019;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main>
  <span class="chip"><img src="/assets/logo.jpg" alt="FOXREX"></span>
  <b>404</b>
  <h1>الصفحة غير موجودة</h1>
  <p>ربما تم نقل الرابط أو حذفه.</p>
  <a class="btn" href="/">العودة إلى الرئيسية</a>
</main>
</body>
</html>
