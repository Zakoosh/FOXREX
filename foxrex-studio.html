<!doctype html>
<html lang="ar" dir="rtl" data-protected>
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<script src="auth.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FOXREX Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* FOXREX tokens — Brand, Design & Content Guidelines v1.0 */
:root{
  --teal:#00D4A7;--teal-2:#00A884;--teal-3:#00806B;--ink:#0B1320;--slate:#1F2937;--gray:#485563;--light:#E5E7EB;
  --sell:#FF5C7A;--pend:#F5B942;--info:#5B9BFF;--ai:#A78BFA;
  --text:#E5E7EB;--muted:rgba(229,231,235,.62);--faint:rgba(229,231,235,.10);--panel:#111B2A;
  --r1:8px;--r2:12px;--r3:16px;
  --ar:"IBM Plex Sans Arabic",system-ui,sans-serif;--num:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--ar);font-size:15px;line-height:1.65}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
span.num,b.num{direction:ltr;unicode-bidi:isolate}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* Shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{border-inline-end:1px solid var(--faint);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;background:#0a111d}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 16px}
.brand .chip{background:#fff;border-radius:var(--r1);padding:3px 6px;display:flex}
.brand img{height:30px;display:block}
.brand b{font-size:15px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:var(--r1);font-size:14px;color:var(--muted)}
.nav button:hover{background:rgba(229,231,235,.05);color:var(--text)}
.nav button[aria-current="page"]{background:rgba(0,212,167,.10);color:#fff}
.nav .cnt{font-family:var(--num);font-size:12px;color:var(--teal)}
.nav .sep{height:1px;background:var(--faint);margin:8px 6px}
main{padding:24px 28px 60px;min-width:0}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;height:auto;z-index:5;padding:8px;border:0;border-bottom:1px solid var(--faint)}
  .brand{padding:2px 4px 8px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav button{white-space:nowrap}
  .nav .sep{display:none}
  main{padding:16px 14px 48px}
}

h1{font-size:22px;margin:0;font-weight:700}
h2{font-size:16px;margin:0 0 12px;font-weight:600}
h3{font-size:14px;margin:0 0 8px;font-weight:600}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.panel{background:var(--panel);border:1px solid var(--faint);border-radius:var(--r3);padding:16px}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
@media (max-width:1100px){.grid3{grid-template-columns:1fr 1fr}}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}

.btn{border:0;border-radius:var(--r2);padding:9px 16px;font-weight:600;cursor:pointer;font-size:14px;background:transparent;border:1px solid var(--faint)}
.btn:hover{border-color:rgba(0,212,167,.5)}
.btn.pri{background:var(--teal);color:var(--ink);border-color:var(--teal)}
.btn.pri:hover{background:#1fe3b8}
.btn.warn{color:var(--pend);border-color:rgba(245,185,66,.4)}
.btn.bad{color:var(--sell);border-color:rgba(255,92,122,.4)}
.btn.big{padding:13px 20px;font-size:16px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--faint);background:transparent;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--teal);color:var(--ink);border-color:var(--teal);font-weight:600}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field{margin-bottom:12px}
input[type=text],input[type=password],input[type=number],input[type=url],input[type=datetime-local],input[type=date],select,textarea{width:100%;background:var(--ink);border:1px solid var(--faint);border-radius:var(--r1);padding:8px 10px;font-size:14px}
input[type=number]{font-family:var(--num);direction:ltr;text-align:right}
textarea{resize:vertical;min-height:70px;line-height:1.7}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:600;border:1px solid var(--faint);white-space:nowrap}
.st-DRAFT{color:var(--muted)}
.st-PROMPT_READY{color:var(--ai);border-color:rgba(167,139,250,.4)}
.st-WAITING_FOR_EXTERNAL_GENERATION{color:var(--pend);border-color:rgba(245,185,66,.45)}
.st-IN_REVIEW{color:var(--info);border-color:rgba(91,155,255,.45)}
.st-FINALIZING{color:var(--info);border-color:rgba(91,155,255,.45)}
.st-APPROVED,.st-SCHEDULED{color:var(--teal);border-color:rgba(0,212,167,.4)}
.st-PUBLISHED{color:#fff;background:var(--teal-3);border-color:var(--teal-3)}

/* Home */
.kpis{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;margin-bottom:16px}
@media (max-width:1200px){.kpis{grid-template-columns:repeat(5,1fr)}}
@media (max-width:600px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{all:unset;cursor:pointer;background:var(--panel);border:1px solid var(--faint);border-radius:var(--r2);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.kpi:hover{border-color:rgba(0,212,167,.4)}
.kpi b{font-family:var(--num);font-size:22px;font-weight:600}
.kpi span{font-size:12px;color:var(--muted);line-height:1.35}
.kpi.hot{border-color:rgba(245,185,66,.5)} .kpi.hot b{color:var(--pend)}
.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.qa button{all:unset;cursor:pointer;border:1px dashed rgba(0,212,167,.35);border-radius:var(--r2);padding:10px 12px;font-size:14px;text-align:center}
.qa button:hover{background:rgba(0,212,167,.07)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:80px 1fr 34px;gap:8px;align-items:center;font-size:13px}
.bar i{display:block;height:8px;border-radius:4px;background:var(--faint);position:relative;overflow:hidden}
.bar i u{position:absolute;inset:0 0 0 auto;background:var(--teal);border-radius:4px}
.bar i s{position:absolute;inset:0 auto 0 0;width:2px;background:var(--pend)}
.list{display:flex;flex-direction:column;gap:6px}
.li{all:unset;cursor:pointer;display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:7px;border-radius:var(--r2);border:1px solid var(--faint);background:var(--ink)}
.li:hover{border-color:rgba(0,212,167,.4)}
.th{width:40px;height:40px;border-radius:6px;object-fit:cover;background:var(--slate);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.li .t{font-size:14px;font-weight:500;line-height:1.35}
.li .m{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:13.5px;padding:10px 4px}

/* Wizard */
.steps{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.steps span{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--faint);color:var(--muted)}
.steps span.on{border-color:var(--teal);color:var(--teal)}
.steps span.done{color:var(--text)}
.wiz{max-width:860px}
.wiz h2{font-size:19px}
.opt{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.opt button{all:unset;cursor:pointer;border:1px solid var(--faint);border-radius:var(--r2);padding:12px;display:flex;flex-direction:column;gap:2px}
.opt button small{color:var(--muted);font-size:12px;line-height:1.4}
.opt button[aria-pressed="true"]{border-color:var(--teal);background:rgba(0,212,167,.08)}
.opt button[aria-pressed="true"] b{color:var(--teal)}
.wiz-nav{display:flex;justify-content:space-between;margin-top:22px;gap:8px}

/* Workspace */
.pipe{display:flex;gap:3px;margin:14px 0 18px;overflow-x:auto;padding-bottom:4px}
.pipe span{flex:1;min-width:74px;text-align:center;font-size:11.5px;padding:6px 4px;border-radius:6px;background:rgba(229,231,235,.05);color:var(--muted);white-space:nowrap}
.pipe span.done{background:rgba(0,212,167,.14);color:var(--text)}
.pipe span.now{background:var(--teal);color:var(--ink);font-weight:700}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13.5px;align-items:start}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.miss{color:var(--sell);font-weight:600}
.ok{color:var(--teal)}
.warnbox{border:1px solid rgba(245,185,66,.4);background:rgba(245,185,66,.07);border-radius:var(--r1);padding:8px 10px;font-size:13px;color:#ffe2a6;margin-top:10px}
.errbox{border:1px solid rgba(255,92,122,.4);background:rgba(255,92,122,.07);border-radius:var(--r1);padding:8px 10px;font-size:13px;color:#ffc2cd;margin-top:10px}
.char{display:grid;grid-template-columns:96px 1fr;gap:12px}
.char img{width:96px;height:88px;object-fit:cover;border-radius:var(--r1)}
.rec{font-size:12px;color:var(--muted)}
.prompt{width:100%;min-height:380px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;direction:ltr;text-align:left;line-height:1.6;background:#070d17}
.vers{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.vers button{all:unset;cursor:pointer;font-size:12px;padding:2px 8px;border-radius:6px;border:1px solid var(--faint)}
.vers button[aria-pressed="true"]{border-color:var(--teal);color:var(--teal)}
.drop{border:1.5px dashed rgba(0,212,167,.45);border-radius:var(--r3);padding:26px;text-align:center;cursor:pointer;display:block}
.drop:hover{background:rgba(0,212,167,.05)}
.drop input{display:none}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.vs{grid-template-columns:1fr}}
.asset-view{background:#070d17;border-radius:var(--r2);border:1px solid var(--faint);display:grid;place-items:center;min-height:260px;overflow:hidden}
.asset-view img,.asset-view video{max-width:100%;max-height:520px;display:block}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13.5px}
@media (max-width:600px){.checks{grid-template-columns:1fr}}
.checks label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.checks input{accent-color:var(--teal);margin-top:4px}
.gens{display:flex;flex-direction:column;gap:8px}
.gen{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:8px;border:1px solid var(--faint);border-radius:var(--r2)}
.gen img{width:56px;height:56px;object-fit:cover;border-radius:6px}
.gen .t{font-size:13.5px;font-weight:600}
.gen .m{font-size:12.5px;color:var(--muted)}
.res-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.res-list li{display:flex;gap:8px}
.res-list .mk{flex:0 0 18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:3px}
.res-list .y .mk{background:rgba(0,212,167,.18);color:var(--teal)}
.res-list .n .mk{background:rgba(255,92,122,.18);color:var(--sell)}
.res-list .n{color:#ffc2cd}
.shot{display:grid;grid-template-columns:70px 1fr;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--faint)}
.shot b{font-family:var(--num);color:var(--teal);font-size:12.5px}

/* Libraries */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters select{width:auto;min-width:130px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--faint);border-radius:var(--r2);overflow:hidden;display:flex;flex-direction:column}
.card .img{aspect-ratio:1/1;background:#070d17;display:grid;place-items:center;color:var(--muted);font-size:12px}
.card .img img,.card .img video{width:100%;height:100%;object-fit:cover}
.card .b{padding:8px 10px;font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.card .b b{font-size:13.5px}
.tagrow{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11.5px;background:rgba(229,231,235,.07);border-radius:5px;padding:0 6px}
.tag.ok{background:rgba(0,212,167,.12)}
.tag.exp{background:rgba(245,185,66,.12);color:var(--pend)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:right;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--faint)}
table.t td{padding:8px;border-bottom:1px solid var(--faint)}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:rgba(229,231,235,.03)}
.scroll{overflow-x:auto}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
@media (max-width:900px){.cal{grid-template-columns:1fr 1fr}}
.day{background:var(--panel);border:1px solid var(--faint);border-radius:var(--r2);padding:8px;min-height:150px}
.day.today{border-color:rgba(0,212,167,.5)}
.day h4{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between}
.ev{all:unset;cursor:pointer;display:block;font-size:12.5px;padding:5px 7px;border-radius:6px;background:rgba(0,212,167,.1);margin-bottom:5px;line-height:1.35}
.ev.pub{background:rgba(229,231,235,.07);color:var(--muted)}

/* Brand kit */
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.sw button{all:unset;cursor:pointer;border:1px solid var(--faint);border-radius:var(--r2);overflow:hidden}
.sw i{display:block;height:56px}
.sw span{display:block;padding:6px 8px;font-size:12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--teal);color:var(--ink);font-weight:600;padding:10px 18px;border-radius:var(--r2);opacity:0;transition:.2s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.admin-bar{display:flex;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--faint)}
.admin-bar a,.admin-bar button{all:unset;cursor:pointer;flex:1;text-align:center;font-size:13px;padding:7px 8px;border-radius:var(--r1);color:var(--muted);border:1px solid var(--faint)}
.admin-bar a:hover,.admin-bar button:hover{color:#fff;border-color:var(--teal)}
@media (max-width:900px){.admin-bar{margin-top:6px;padding-top:6px}}
</style>
</head>

/** Decide whether the UI can offer automatic generation. Only subscription-credit providers qualify. Paid providers are ignored even if reported available. */
function clientRoute(providers,type){
  const auto=(providers||[]).filter(p=>p&&p.costMode==="SUBSCRIPTION_CREDITS"&&p.implemented&&p.status&&p.status.available&&p.capabilities&&p.capabilities[type||"image"]);
  auto.sort((a,b)=>(a.priority||99)-(b.priority||99));
  return auto.length?{mode:"auto",provider:auto[0].id,credits:auto[0].status.credits??null}:{mode:"manual"};
}
/** The job request the Studio sends. It never names a paid provider: provider is either omitted (worker routes) or MANUAL_CLAUDE. */
function jobRequest({prompt,aspectRatio,variations,contentId,promptVersionId,characterAssetId,references,type,manual}){
  const r={prompt,aspectRatio,variations:Math.min(3,Math.max(1,+variations||1)),contentId,promptVersionId,characterAssetId,references:references||[],type:type||"image"};
  if(manual) r.provider="MANUAL_CLAUDE";
  return r;
}

async function wapi(path,opts={}){
  if(!DB.settings.workerUrl) throw Object.assign(new Error("worker not configured"),{code:"WORKER_NOT_CONFIGURED"});
  let r; try{ r=await fetch(wurl(path),{...opts,headers:{"Content-Type":"application/json",...(DB.settings.workerToken?{Authorization:"Bearer "+DB.settings.workerToken}:{}),...(opts.headers||{})}}); }

  if(r.status===401) throw Object.assign(new Error("HTTP 401: the worker is reachable, but its bearer token is missing or different. Copy STUDIO_WORKER_TOKEN from the existing worker/.env privately into Settings; do not overwrite .env."),{code:"WORKER_UNAUTHORIZED"});
  if(!r.ok){ const detail=await r.json().catch(()=>({})); throw Object.assign(new Error(detail.error||detail.message||"HTTP "+r.status),{code:"WORKER_ERROR"}); }
  return r.json();
}

  if(scene==null&&!skipReuse&&!manual&&reuseMatches(it).length&&!it.generations.length){ S.reuseOffer=it.id; render(); return; }

  const job={localId:uid(),id:null,status:"QUEUED",provider:null,prompt_version_id:`${it.id}:v${pv.v}`,promptV:pv.v,scene,character_asset_id:refs[0]?.assetId||null,

const polling=new Set();
async function poll(itemId,localId){
  const key=itemId+localId; if(polling.has(key)) return; polling.add(key);
  try{
    for(let i=0;i<400;i++){
      const it=DB.items.find(x=>x.id===itemId), job=it&&(it.jobs||[]).find(j=>j.localId===localId);
      if(!job||!job.id||["COMPLETED","FAILED","CANCELLED","MANUAL_REQUIRED"].includes(job.status)) return;
      await new Promise(r=>setTimeout(r,2500));
      try{ const fresh=await wapi("/jobs/"+job.id); const before=job.status; Object.assign(job,fresh); if(fresh.status!==before||["COMPLETED","FAILED","MANUAL_REQUIRED","CANCELLED"].includes(fresh.status)) onJobUpdate(it,job); }
      catch(e){ if(i>20){ Object.assign(job,{status:"FAILED",failure_code:e.code||"WORKER_OFFLINE",failure_message:"Lost contact with the generation worker."}); onJobUpdate(it,job); return; } }
    }
    const it=DB.items.find(x=>x.id===itemId), job=it&&it.jobs.find(j=>j.localId===localId);
    if(job&&!["COMPLETED","FAILED","CANCELLED","MANUAL_REQUIRED"].includes(job.status)){ Object.assign(job,{status:"FAILED",failure_code:"GENERATION_TIMEOUT",failure_message:"No result within the polling window."}); onJobUpdate(it,job); }
  } finally { polling.delete(key); }
}
function resumePolling(){ DB.items.forEach(it=>(it.jobs||[]).forEach(j=>{ if(j.id&&!["COMPLETED","FAILED","CANCELLED","MANUAL_REQUIRED"].includes(j.status)) poll(it.id,j.localId); })); }

async function autoValidate(it,g){
  const a=assetById(g.assetId); if(!a||a.type!=="image"||g.auto) return;
  g.auto={pending:true}; 
  try{
    const img=await new Promise((ok,bad)=>{const i=new Image();i.crossOrigin="anonymous";i.onload=()=>ok(i);i.onerror=bad;i.src=srcOf(a);});
    const W=img.naturalWidth,H=img.naturalHeight,cv=document.createElement("canvas"),w=96,h=Math.max(1,Math.round(96*H/W));cv.width=w;cv.height=h;
    const cx=cv.getContext("2d");cx.drawImage(img,0,0,w,h);const d=cx.getImageData(0,0,w,h).data;
    let dark=0,neon=0,teal=0;const L=new Float32Array(w*h);
    for(let i=0;i<w*h;i++){const r=d[i*4]/255,gg=d[i*4+1]/255,b=d[i*4+2]/255,mx=Math.max(r,gg,b),mn=Math.min(r,gg,b),s=mx?(mx-mn)/mx:0;L[i]=.2126*r+.7152*gg+.0722*b;
      let hue=0;if(mx!==mn){hue=mx===r?((gg-b)/(mx-mn))%6:mx===gg?(b-r)/(mx-mn)+2:(r-gg)/(mx-mn)+4;hue=(hue*60+360)%360;}
      if(L[i]<.28)dark++; if(s>.85&&mx>.85)neon++; if(hue>=150&&hue<=195&&s>.35&&mx>.35)teal++;}
    const edge=(x0,x1,y0,y1)=>{let e=0,n=0;for(let y=Math.max(1,y0);y<y1;y++)for(let x=Math.max(1,x0);x<x1;x++){e+=Math.abs(L[y*w+x]-L[y*w+x-1])+Math.abs(L[y*w+x]-L[(y-1)*w+x]);n++;}return n?e/n:0;};
    const fs=freeSide(it),all=edge(0,w,0,h),zone=fs==="left"?edge(0,w>>1,0,h):fs==="right"?edge(w>>1,w,0,h):edge(0,w,0,Math.round(h*.35));
    const [aw,ah]=FORMATS[it.format].ar_.split(":").map(Number),n=w*h;
    g.auto={ratio:{ok:Math.abs(W/H-aw/ah)<.03,v:`${W}×${H}`},res:{ok:Math.min(W,H)>=1000,v:`${Math.min(W,H)}px`},dark:{ok:dark/n>=.45,v:Math.round(dark/n*100)+"%"},
      neon:{ok:neon/n<=.06,v:Math.round(neon/n*100)+"%"},teal:{ok:teal/n>=.01&&teal/n<=.35,v:Math.round(teal/n*100)+"%"},space:{ok:zone<=all*.85||zone<.03,v:(zone/Math.max(all,1e-6)).toFixed(2)}};
  }catch(e){ g.auto={error:true}; }
  save(); if(S.view==="item") render();
}

    <section class="panel"><h2>تغطية المنصات</h2><div class="bars">${plat.map(([p,n])=>`<div class="bar"><span>${p}</span><i><u style="width:${n/Math.max(1,week.length)*100}%"></u></i><span class="num">${n}</span></div>`).join("")}</div><p class="hint" style="margin-top:12px">منصات إضافية تُضاف من الإعدادات لاحقاً.</p></section>
  </div>
  <div class="grid2">
    <section class="panel"><h2>بانتظار إجراء منك</h2>${list(DB.items.filter(i=>["PROMPT_READY","WAITING_FOR_EXTERNAL_GENERATION","IN_REVIEW","FINALIZING"].includes(i.status)))}</section>
    <section class="panel"><h2>القادم</h2>${list(upcoming,i=>` · ${fmtDate(i.scheduledAt)}`)}</section>
  </div>`;
};

/* Wizard */
const WSTEPS=["ماذا ننشئ؟","أين؟","الهدف","الموضوع","المصدر والبيانات"];
function wizStart(fmt,fam){ const it=newItem({format:fmt||"post",family:fam||"analysis"}); it.objective=FAM[it.family].obj; S.wiz={step:0,it}; go("create"); }
VIEWS.create=()=>{
  if(!S.wiz) return `<div class="head"><div><h1>إنشاء</h1><p>ابدأ من معالج منظّم، لا من محرر فارغ.</p></div><button class="btn pri" data-act="wiz">ابدأ المعالج</button></div>
    <div class="grid2"><section class="panel"><h2>جاهز للتوليد</h2><p class="hint">اضغط «إنشاء المحتوى» داخل العنصر.</p>${list(DB.items.filter(i=>["PROMPT_READY","GENERATING"].includes(i.status)))}</section>
    <section class="panel"><h2>توليد يدوي مطلوب</h2><p class="hint">المزوّد التلقائي لم يكن متاحاً. أعد المحاولة أو ولّد يدوياً وارفع النتيجة.</p>${list(DB.items.filter(i=>i.status==="WAITING_FOR_EXTERNAL_GENERATION"))}</section></div>`;
  const w=S.wiz,it=w.it,F=FAM[it.family];let body="";
  if(w.step===0) body=`<h2>ماذا ننشئ؟</h2><label class="f">الصيغة</label><div class="opt" style="margin-bottom:16px">${Object.entries(FORMATS).map(([k,f])=>`<button data-act="wset" data-k="format" data-v="${k}" aria-pressed="${it.format===k}"><b>${f.ar}</b><small class="num">${f.dim} · ${f.ar_}</small></button>`).join("")}</div>
    <label class="f">نوع المحتوى</label><div class="opt">${Object.entries(FAM).map(([k,f])=>`<button data-act="wset" data-k="family" data-v="${k}" aria-pressed="${it.family===k}"><b>${f.ar}</b><small>${f.struct.slice(0,3).join(" ← ")}</small></button>`).join("")}</div>`;
  if(w.step===1) body=`<h2>أين سيُنشر؟</h2><p class="hint">اختر منصة أو أكثر.</p><div class="opt">${PLATFORMS.map(p=>`<button data-act="wplat" data-v="${p}" aria-pressed="${it.platforms.includes(p)}"><b>${p}</b></button>`).join("")}</div>`;
  if(w.step===2) body=`<h2>هدف المحتوى</h2><div class="opt">${Object.entries(OBJECTIVES).map(([k,l])=>`<button data-act="wset" data-k="objective" data-v="${k}" aria-pressed="${it.objective===k}"><b>${l}</b></button>`).join("")}</div>`;
  if(w.step===3) body=`<h2>الموضوع</h2><div class="chips" style="margin-bottom:12px">${TOPICS.map(t=>`<button class="chip" data-act="wset" data-k="topic" data-v="${t}" aria-pressed="${it.topic===t}">${t}</button>`).join("")}</div>
    <label class="f" for="w-topic">أو اكتب الموضوع</label><input type="text" id="w-topic" data-w="topic" value="${esc(it.topic)}">`;
  if(w.step===4) body=`<h2>المصدر والبيانات</h2><p class="hint">لا تُخترع أي بيانات سوق حالية. الحقول المطلوبة الفارغة ستظهر في الموجز كنواقص.</p>
    <div class="fg" style="margin-bottom:12px"><div><label class="f">نوع المصدر</label><select data-w="source.kind">${Object.entries(SOURCES).map(([k,l])=>`<option value="${k}" ${it.source.kind===k?"selected":""}>${l}</option>`).join("")}</select></div></div>
    <div class="fg">${fieldsHtml(it,"data-w")}</div>
    <div class="field" style="margin-top:12px"><label class="f">ملاحظات المصدر أو الرابط</label><textarea data-w="source.notes" placeholder="مرجع الإشارة، رابط الخبر، ملاحظات التحليل...">${esc(it.source.notes)}</textarea></div>
    <label class="drop" style="padding:14px"><input type="file" accept="image/*,application/pdf" data-act-file="source">إرفاق شارت أو لقطة شاشة أو مستند كمرجع (اختياري)${it.sourceAsset?` <span class="ok">✓ ${esc((DB.assets.find(a=>a.id===it.sourceAsset)||{}).name||"")}</span>`:""}</label>
    <label class="row" style="margin-top:12px;font-size:14px;cursor:pointer"><input type="checkbox" data-w="verified" ${it.verified?"checked":""} style="accent-color:var(--teal)"> تحققت من البيانات من مصدر موثّق</label>`;
  return `<div class="wiz"><div class="head"><div><h1>محتوى جديد</h1><p>${FORMATS[it.format].ar} · ${F.ar}</p></div><button class="btn" data-act="wcancel">إلغاء</button></div>
    <div class="steps">${WSTEPS.map((s,i)=>`<span class="${i===w.step?"on":i<w.step?"done":""}">${i+1}. ${s}</span>`).join("")}</div>
    <section class="panel">${body}
    <div class="wiz-nav"><button class="btn" data-act="wprev" ${w.step===0?"disabled":""}>السابق</button><span class="row">${w.step===4?`<button class="btn" data-act="wdraft">حفظ كمسودة</button><button class="btn pri" data-act="wfinish">إنشاء المحتوى</button>`:`<button class="btn pri" data-act="wnext">التالي</button>`}</span></div></section></div>`;
};
function fieldsHtml(it,attr){ return FAM[it.family].fields.map(f=>{const v=it.data[f.id]??"";let inp;
  if(f.t==="sel") inp=`<select ${attr}="data.${f.id}" data-rr="1">${f.o.map(o=>`<option ${String(v)===o?"selected":""}>${o}</option>`).join("")}</select>`;
  else if(f.t==="area") inp=`<textarea ${attr}="data.${f.id}" placeholder="${f.ph||""}">${esc(v)}</textarea>`;
  else inp=`<input type="${f.t==="num"?"number":"text"}" step="any" ${attr}="data.${f.id}" value="${esc(v)}" placeholder="${f.ph||""}">`;
  return `<div style="${f.t==="area"?"grid-column:1/-1":""}"><label class="f">${f.l}${f.req?' <span class="miss">*</span>':""}</label>${inp}</div>`; }).join(""); }

/* Item workspace — Simple mode: content → generate → review → approve. Advanced details stay one click away. */
VIEWS.item=()=>{
  const it=cur(); if(!it) return VIEWS.library();
  it.jobs=it.jobs||[];
  const at=PIPE_AT[it.status], adv=DB.settings.mode==="advanced", miss=missing(it), c=it.char;
  const tc=it.final.caption?textChecks(it):[];
  return `<div class="head"><div><div class="row" style="margin-bottom:6px">${pill(it.status)}<span class="hint" style="margin:0">${FAM[it.family].ar} · ${FORMATS[it.format].ar} <span class="num">${FORMATS[it.format].dim}</span> · ${it.platforms.join("، ")}</span></div><h1>${esc(it.brief.hook)}</h1></div>
    <div class="row"><div class="chips" role="group" aria-label="وضع العرض"><button class="chip" data-act="mode" data-v="simple" aria-pressed="${!adv}">بسيط</button><button class="chip" data-act="mode" data-v="advanced" aria-pressed="${adv}">متقدم</button></div><button class="btn" data-act="dup">تكرار</button><button class="btn bad" data-act="del">حذف</button></div></div>
  <div class="pipe" aria-label="سير العمل">${PIPE.map((p,i)=>`<span class="${i<at?"done":i===at?"now":""}">${p}</span>`).join("")}</div>

  <div class="grid2" style="margin-bottom:16px;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)">
    <section class="panel"><h2>المحتوى</h2>
      <div class="field"><label class="f">الخطّاف</label><input type="text" data-p="brief.hook" data-be="1" value="${esc(it.brief.hook)}"></div>
      <div class="field"><label class="f">الرسالة الرئيسية</label><input type="text" data-p="brief.key" data-be="1" value="${esc(it.brief.key)}"></div>
      <div class="field"><label class="f">الدعوة (CTA)</label><input data-p="brief.cta" value="${esc(it.brief.cta)}" placeholder="دعوة يكتبها المشغّل أو يختارها من خطة AI"></div>
      <details ${miss.length?"open":""}><summary style="cursor:pointer;font-size:14px;margin-bottom:8px">البيانات ${miss.length?`<span class="miss">(${miss.length} ناقص)</span>`:'<span class="ok">✓</span>'}</summary>
        <div class="fg">${fieldsHtml(it,"data-p")}</div>
        <label class="row" style="margin-top:10px;font-size:13.5px;cursor:pointer"><input type="checkbox" data-p="verified" ${it.verified?"checked":""} style="accent-color:var(--teal)"> البيانات متحقق منها من مصدر موثّق</label></details>
      ${miss.length?`<div class="errbox">مطلوب ولن يُخترع: ${miss.join("، ")}</div>`:""}
      <p class="hint" style="margin:12px 0 0">${c.required?`الشخصية: ${c.exp} · ${POSES[c.pose].ar} · <span class="num">${c.prom}%</span> · ${POSITIONS[c.position]}`:"بدون شخصية"} — <a href="#" data-act="opendetails">تعديل التوجيه</a></p>
      ${charWarnings(it).map(w=>`<div class="errbox">${w}</div>`).join("")}
    </section>
    <section class="panel">${genPanel(it)}</section>
  </div>
  ${it.format==="reel"?reelBoard(it):""}
  ${resultsPanel(it)}
  ${["FINALIZING","APPROVED","SCHEDULED","PUBLISHED"].includes(it.status)?`
  <div class="grid2" style="margin-bottom:16px">
    <section class="panel"><h2>النص والبيانات النهائية</h2><p class="hint">تُضاف فوق الأصل المعتمد في طبقة التركيب، من بيانات موثّقة فقط. الشعار الرسمي يوضع كملف، لا يُولَّد.</p>
      <div class="checks" style="grid-template-columns:1fr">${postProd(it).map((x,i)=>`<label><input type="checkbox" data-ov="${i}" ${it.final.overlays[i]?"checked":""}>${esc(x)}</label>`).join("")}</div>
      <div class="field" style="margin-top:12px"><label class="f">النص المرافق</label><textarea data-p="final.caption" data-live="1" style="min-height:200px">${esc(it.final.caption)}</textarea></div>
      <ul class="res-list" id="tchecks">${tc.map(x=>`<li class="${x.ok?"y":"n"}"><span class="mk">${x.ok?"✓":"✕"}</span>${esc(x.t)}</li>`).join("")}</ul>
      ${it.status==="FINALIZING"?`<button class="btn pri" style="margin-top:12px" data-act="approve-content" ${tc.every(x=>x.ok)?"":"disabled"} id="appr">اعتماد المحتوى</button>`:""}
    </section>
    <section class="panel"><h2>النشر</h2>
      ${it.status==="APPROVED"||it.status==="SCHEDULED"?`<label class="f">موعد النشر</label><div class="row"><input type="datetime-local" id="sch" value="${toLocal(it.scheduledAt||Date.now()+864e5)}" style="width:auto"><button class="btn pri" data-act="schedule">${it.status==="SCHEDULED"?"تحديث الموعد":"جدولة"}</button></div>
        <p class="hint" style="margin-top:10px">حزمة النشر: الأصل النهائي، النص المرافق، المنصات (${it.platforms.join("، ")}).</p>
        <div class="row"><button class="btn" data-act="copycap">نسخ النص المرافق</button>${it.status==="SCHEDULED"?`<button class="btn pri" data-act="publish">تم النشر</button>`:""}</div>`:""}
      ${it.status==="FINALIZING"?`<p class="hint">يُفعَّل بعد اعتماد المحتوى.</p>`:""}
      ${it.status==="PUBLISHED"?`<p class="ok">✓ نُشر ${fmtDate(it.publishedAt)}</p>${metricsForm(it)}`:""}
    </section>
  </div>`:""}
  <details class="panel" id="adv" ${adv||S.showDetails?"open":""}><summary style="cursor:pointer;font-weight:600;font-size:16px">التفاصيل المتقدمة <span class="hint">(الموجز، الشخصية، البرومبت، المزوّد، المهام)</span></summary>
    <div style="margin-top:16px">${advancedHtml(it)}</div></details>`;
};

function genPanel(it){
  const job=lastJob(it), active=activeJob(it)&&activeJob(it).scene==null?activeJob(it):null;
  const pr=DB.providers, route=clientRoute(pr&&pr.list,"image"), c=it.char;
  if(S.reuseOffer===it.id){ const m=reuseMatches(it);
    return `<h2>إعادة استخدام قبل التوليد</h2><p class="hint">يوجد ${m.length} أصل معتمد في مكتبة الشخصية بنفس التعبير (${c.exp}) والوضعية (${POSES[c.pose].ar}). إعادة الاستخدام توفّر الرصيد وتحافظ على اتساق الشخصية.</p>
      <div class="row">${m.slice(0,4).map(a=>`<button class="btn" style="padding:4px;display:flex;gap:6px;align-items:center" data-act="reuse" data-a="${a.id}"><img src="${srcOf(a)}" alt="" style="width:44px;height:44px;object-fit:cover;border-radius:6px">استخدام</button>`).join("")}</div>
      <div class="row" style="margin-top:12px"><button class="btn pri" data-act="gen" data-skip="1">توليد جديد رغم ذلك</button><button class="btn" data-act="reuse-cancel">رجوع</button></div>`; }
  if(active){ const idx=JOB_FLOW.indexOf(active.status);
    return `<h2>جارٍ التوليد</h2><p class="hint">${active.provider?`${esc(active.provider)} · `:""}${active.model?`<span class="num">${esc(active.model)}</span> · `:""}${active.parameters.variations} نسخة · Prompt v${active.promptV}</p>
      <div class="pipe" style="margin:10px 0">${JOB_FLOW.map((s,i)=>`<span class="${i<idx?"done":i===idx?"now":""}">${JOB_ST[s]}</span>`).join("")}</div>
      <p class="hint">المهمة محفوظة. يمكنك مغادرة الصفحة والعودة لاحقاً.${active.estimated_cost&&active.estimated_cost.credits!=null?` الاستهلاك المتوقع: <span class="num">${active.estimated_cost.credits}</span> رصيد.`:""}</p>
      <button class="btn" data-act="canceljob">إلغاء</button>`; }
  if(it.status==="WAITING_FOR_EXTERNAL_GENERATION"){
    return `<h2>التوليد التلقائي غير متاح حالياً</h2>
      ${job&&job.failure_code?(()=>{const cause=(job.routing||[]).find(r=>r.id==="HIGGSFIELD_CLI");return `<div class="warnbox">${esc(FAIL_AR[job.failure_code]||job.failure_code)}${cause?` — السبب: ${esc(FAIL_AR[cause.reason]||cause.reason)}`:""}.<br>لم يُستخدم أي API مدفوع. إنفاق API: <span class="num">$0.00</span></div>`;})():""}
      <p class="hint" style="margin-top:10px">يمكنك إعادة المحاولة، أو التوليد يدوياً: انسخ البرومبت إلى Claude ثم ارفع النتيجة.</p>
      <div class="row"><button class="btn pri" data-act="gen" data-skip="1">إعادة المحاولة</button><button class="btn" data-act="copyprompt">نسخ البرومبت</button></div>
      <label class="drop" style="margin-top:12px"><input type="file" accept="image/*,video/*" data-act-file="gen"><b>رفع الأصل المولّد</b><br><span class="hint">سيُربط بـ Prompt v${(it.prompts.slice(-1)[0]||{v:1}).v}</span></label>`; }
  if(["IN_REVIEW","FINALIZING","APPROVED","SCHEDULED","PUBLISHED"].includes(it.status)){
    const g=it.generations.find(x=>x.status==="approved"), a=g&&assetById(g.assetId);
    return `<h2>${g?"الأصل المعتمد":"نتائج التوليد جاهزة"}</h2>${a?`<div class="asset-view" style="min-height:0">${assetTag(a)}</div>`:`<p class="hint">راجع النسخ أدناه واعتمد واحدة.</p>`}`; }
  const failed=job&&job.scene==null&&job.status==="FAILED"?job:null;
  const uncertain=failed&&(failed.failure_code==="SUBMISSION_UNCONFIRMED"||
    (failed.failure_code==="PROVIDER_ERROR"&&failed.failure_message==="CLI did not return a job id"));
  return `<h2>التوليد</h2>
    ${failed?`<div class="errbox">فشلت المحاولة الأخيرة: ${esc(FAIL_AR[failed.failure_code]||failed.failure_code)}${failed.failure_message?` — <span class="ltr">${esc(failed.failure_message)}</span>`:""}</div>`:""}
    ${uncertain?`<div class="warnbox">قد يكون التوليد اكتمل واستهلك رصيداً. راجع سجل Higgsfield ثم اربط المهمة الحالية بمعرّفها. لا تنشئ نسخة جديدة قبل الاستعادة.</div>
      <button class="btn pri" data-act="recoverjob">استعادة الصورة من Higgsfield</button>`:""}
    <p class="hint" style="margin-top:8px">يبني الاستوديو الموجز والتوجيه البصري والبرومبت تلقائياً، ويرفق مرجع الشخصية الرئيسي${c.required?"":" (غير مطلوب هنا)"}.</p>
    <div class="row" style="margin-bottom:12px"><label class="f" style="margin:0">عدد النسخ</label>${[1,2,3].map(n=>`<button class="chip" data-act="vars" data-v="${n}" aria-pressed="${DB.settings.variations==n}">${n}</button>`).join("")}</div>
    <button class="btn pri big" data-act="gen" style="width:100%" ${miss(it)||uncertain?"disabled":""}>${failed?"إعادة المحاولة":"إنشاء المحتوى"}</button>
    <p class="hint" style="margin-top:10px">${route.mode==="auto"?`سيُستخدم <b>${route.provider==="HIGGSFIELD_CLI"?"Higgsfield CLI":route.provider}</b> برصيد الاشتراك${route.credits!=null?` · الرصيد المتاح <span class="num">${route.credits}</span>`:""}. قد يستهلك التوليد رصيد الاشتراك.`:`التوليد التلقائي غير متاح (${esc(FAIL_AR[pr&&pr.error]||"لا يوجد مزوّد اشتراك متصل")}). سيتحول إلى التوليد اليدوي — بلا أي تكلفة API.`}</p>`;
}
const miss=it=>missing(it).length>0;

function resultsPanel(it){
  const batch=it.generations.filter(g=>g.status==="review");
  if(it.status!=="IN_REVIEW"||!batch.length) return "";
  batch.forEach(g=>{ if(!g.auto) autoValidate(it,g); });
  const fb=S.feedbackFor;
  return `<section class="panel" style="margin-bottom:16px"><h2>المحتوى المولّد</h2><p class="hint">الفحص الآلي يقيس ما يمكن قياسه من البكسلات فقط، وليس نهائياً. الاعتماد البشري مطلوب.</p>
  <div class="cards" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">${batch.map(g=>{const a=assetById(g.assetId),job=it.jobs.find(j=>j.id===g.jobId)||{};
    return `<div class="card"><div class="img" style="aspect-ratio:${FORMATS[it.format].ar_.replace(":","/")}">${assetTag(a)}</div><div class="b">
      <b>النسخة ${String(g.variation||g.n).padStart(2,"0")} · Prompt v${g.promptV||"—"}${g.reused?" · من المكتبة":""}</b>
      <div class="tagrow">${g.auto&&!g.auto.pending&&!g.auto.error?Object.entries(g.auto).map(([k,v])=>`<span class="tag ${v.ok?"ok":"exp"}" title="${esc(v.v)}">${v.ok?"✓":"!"} ${AUTO_L[k]}</span>`).join(""):g.auto&&g.auto.error?'<span class="tag exp">تعذّر الفحص الآلي</span>':'<span class="tag">جارٍ الفحص…</span>'}</div>
      <div class="checks" style="grid-template-columns:1fr;margin-top:6px">${HUMAN_CHECKS.map(([k,l])=>`<label><input type="checkbox" data-hc="${g.n}:${k}" ${g.checks[k]?"checked":""}>${l}</label>`).join("")}</div>

function reelBoard(it){
  it.scenes=it.scenes||[]; const sh=reelShots(it);
  const ST_AR={NOT_STARTED:"لم يبدأ",GENERATING:"جارٍ التوليد",GENERATED:"مولّد",APPROVED:"معتمد",REJECTED:"مرفوض",FAILED:"فشل",MANUAL_REQUIRED:"يدوي مطلوب"};
  const cover=it.generations.find(g=>g.status==="approved")?"APPROVED":it.status==="IN_REVIEW"?"GENERATED":it.status==="GENERATING"?"GENERATING":"NOT_STARTED";
  const row=(label,st,extra="")=>`<div class="shot" style="grid-template-columns:130px 110px 1fr;align-items:center"><b style="font-family:var(--ar);color:var(--text)">${label}</b><span class="pill st-${{APPROVED:"APPROVED",GENERATED:"IN_REVIEW",GENERATING:"WAITING_FOR_EXTERNAL_GENERATION",REJECTED:"DRAFT",FAILED:"DRAFT",MANUAL_REQUIRED:"WAITING_FOR_EXTERNAL_GENERATION",READY:"APPROVED",PENDING:"DRAFT",NOT_STARTED:"DRAFT"}[st]}">${ST_AR[st]||{READY:"جاهز",PENDING:"معلّق"}[st]}</span><span>${extra}</span></div>`;
  return `<section class="panel" style="margin-bottom:16px"><h2>لوحة إنتاج الريل</h2><p class="hint">الريل ليس طلب توليد واحداً: كل مشهد مهمة مستقلة. هنا تُولَّد الإطارات المرجعية للمشاهد؛ توليد الفيديو من هذه الإطارات هو المرحلة 3 (معطّل الآن).</p>
    ${row("السكربت",sh.length?"READY":"PENDING",`<span class="hint">${it.duration} ثانية · ${sh.length} مشاهد</span>`)}
    ${sh.map((s,i)=>{const sc=it.scenes[i]||{status:"NOT_STARTED"},a=sc.assetId&&assetById(sc.assetId);
      return row(`المشهد ${String(i+1).padStart(2,"0")} · ${esc(s.ar)}`,sc.status,`<span class="row">${a?`<img src="${srcOf(a)}" alt="" style="width:36px;height:64px;object-fit:cover;border-radius:5px">`:""}<span class="hint ltr" style="margin:0">${esc(s.t)}</span>
        ${sc.status==="GENERATING"?"":`<button class="btn" style="padding:3px 10px;font-size:12px" data-act="scene-gen" data-i="${i}">${a?"إعادة توليد الإطار":"توليد إطار مرجعي"}</button>`}
        ${sc.status==="GENERATED"?`<button class="btn pri" style="padding:3px 10px;font-size:12px" data-act="scene-ok" data-i="${i}">اعتماد</button><button class="btn bad" style="padding:3px 10px;font-size:12px" data-act="scene-no" data-i="${i}">رفض</button>`:""}
        <label class="btn" style="padding:3px 10px;font-size:12px">رفع<input type="file" accept="image/*,video/*" data-act-file="scene" data-i="${i}" hidden></label></span>`);}).join("")}
    ${row("التعليق الصوتي","PENDING",'<span class="hint">المرحلة 3</span>')}
    ${row("الغلاف",cover,'<span class="hint">يُولَّد بزر «إنشاء المحتوى»</span>')}
    ${row("المونتاج النهائي","PENDING",'<span class="hint">خارج الاستوديو حالياً</span>')}</section>`;
}

const ACT={
  go:el=>{ S.filter={}; if(el.dataset.f) S.filter.status=el.dataset.f; go(el.dataset.v); },
  wiz:el=>wizStart(el.dataset.fmt,el.dataset.fam),
  wcancel:()=>{S.wiz=null;render();},
  wset:el=>{ const w=S.wiz,k=el.dataset.k,v=el.dataset.v; if(k==="family"){ const keep={format:w.it.format,platforms:w.it.platforms,topic:w.it.topic}; w.it=newItem({...keep,family:v}); w.it.objective=FAM[v].obj; } else { w.it[k]=v; if(k==="topic"&&w.it.data.sym!==undefined&&SYMBOLS.includes(v)) w.it.data.sym=v; if(k==="format") w.it.char=recommendChar(w.it);} refreshDerived(w.it); render(); },
  wplat:el=>{ const p=S.wiz.it.platforms,v=el.dataset.v; const i=p.indexOf(v); i>-1?p.length>1&&p.splice(i,1):p.push(v); render(); },

function revFail(kind){
  const it=cur(),g=it.generations.slice(-1)[0],note=($("#rev-note")||{}).value||"";
  const failed=REVIEW.filter(r=>!g.checks[r.k]); 
  if(!failed.length&&!note){ toast("حدد البنود غير المحققة أو اكتب ملاحظة"); return; }
  g.status=kind; g.feedback=failed.map(r=>r.l).concat(note?[note]:[]);
  const a=DB.assets.find(x=>x.id===g.assetId); if(a&&!g.reused) a.approval="rejected";
  it.corrections=failed.map(r=>typeof r.fix==="function"?r.fix(it):r.fix).concat(note?[`Additional note from reviewer: ${note}`]:[]);
  it.status="PROMPT_READY"; S.promptV=null; save(); render(); toast("بُني برومبت محسّن بالتصحيحات. انسخه من جديد");
}

/* ---------------- EVENTS ---------------- */
document.addEventListener("click",e=>{ const a=e.target.closest("[data-act]"); if(!a||a.tagName==="INPUT") return; const f=ACT[a.dataset.act]; if(f){ if(a.tagName==="A") e.preventDefault(); f(a,e); } });
function setPath(o,p,v){ const k=p.split("."); let x=o; for(let i=0;i<k.length-1;i++){ x[k[i]]=x[k[i]]??{}; x=x[k[i]]; } x[k.at(-1)]=v; }
function valOf(el){ if(el.type==="checkbox") return el.checked; const v=el.value; if(el.dataset.p==="char.required") return v==="true"; if(el.dataset.p==="char.prom"||el.dataset.p==="duration") return +v; return v; }
function onEdit(e){
  const el=e.target;
  if(el.dataset.w!==undefined){ const it=S.wiz.it; setPath(it,el.dataset.w,valOf(el)); if(el.dataset.w==="topic"&&it.data.sym!==undefined&&SYMBOLS.includes(el.value)) it.data.sym=el.value; if(e.type==="change") refreshDerived(it); return; }
  if(el.dataset.p){ const it=cur(); if(!it) return;
    setPath(it,el.dataset.p,valOf(el));
    if(el.dataset.ovChar){ const k=el.dataset.p.split(".")[1]; it.char.overridden[k]=true; }
    if(el.dataset.be) it.briefEdited=true;
    if(el.dataset.p.startsWith("data.")&&["DRAFT","PROMPT_READY","WAITING_FOR_EXTERNAL_GENERATION"].includes(it.status)) refreshDerived(it);
    save();
    if(el.dataset.live){ const tc=textChecks(it); $("#tchecks").innerHTML=tc.map(x=>`<li class="${x.ok?"y":"n"}"><span class="mk">${x.ok?"✓":"✕"}</span>${esc(x.t)}</li>`).join(""); const b=$("#appr"); if(b) b.disabled=!tc.every(x=>x.ok); return; }
    if(e.type==="change") render(); else { const p=$("#prompt-box"); if(p&&!S.promptV){ S._promptText=buildPrompt(it); p.value=S._promptText; } }
    return; }
  if(el.dataset.hc){ const [n,k]=el.dataset.hc.split(":"),g=cur().generations.find(x=>x.n==n); g.checks[k]=el.checked; save(); const b=document.querySelector(`[data-act="approve-var"][data-n="${n}"]`); if(b) b.disabled=!HUMAN_CHECKS.every(([q])=>g.checks[q]); return; }
  if(el.dataset.rev){ const g=cur().generations.slice(-1)[0]; g.checks[el.dataset.rev]=el.checked; save(); const b=document.querySelector('[data-act="rev-ok"]'); if(b) b.disabled=!REVIEW.every(r=>g.checks[r.k]); return; }
  if(el.dataset.ov!==undefined){ const it=cur(); it.final.overlays[+el.dataset.ov]=el.checked; save(); const tc=textChecks(it); $("#tchecks").innerHTML=tc.map(x=>`<li class="${x.ok?"y":"n"}"><span class="mk">${x.ok?"✓":"✕"}</span>${esc(x.t)}</li>`).join(""); const b=$("#appr"); if(b) b.disabled=!tc.every(x=>x.ok); return; }
  if(el.dataset.cf!==undefined){ S.filter[el.dataset.cf]=el.value; render(); return; }
  if(el.dataset.appr){ DB.assets.find(a=>a.id===el.dataset.appr).approval=el.value; save(); return; }
  if(el.dataset.tg){ DB.targets[el.dataset.tg]=+el.value; save(); if(e.type==="change") render(); return; }
  if(el.dataset.set){ DB.settings[el.dataset.set]=el.value; save(); return; }
}

document.addEventListener("change",e=>{ if(e.target.dataset.actFile) return onFile(e); onEdit(e); });

async function readAsset(file){
  if(file.type.startsWith("video/")) return {type:"video",src:URL.createObjectURL(file),name:file.name,orient:"vertical",volatile:true};
  if(file.type==="application/pdf") return {type:"doc",src:"",name:file.name};
  const url=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(file);});
  const img=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=url;});
  const sc=Math.min(1,1350/Math.max(img.width,img.height)), cv=document.createElement("canvas"); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
  cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
  return {type:"image",src:cv.toDataURL("image/jpeg",.85),name:file.name,w:img.width,h:img.height,orient:img.height>img.width*1.1?"vertical":img.width>img.height*1.1?"horizontal":"square"};
}
async function onFile(e){
  const file=e.target.files[0],kind=e.target.dataset.actFile; if(!file) return;
  if(kind==="import"){ const t=await file.text(); try{ DB=JSON.parse(t); save(); go("home"); toast("تم الاستيراد"); }catch(x){ toast("الملف غير صالح"); } return; }
  const r=await readAsset(file);
  if(kind==="source"){ const a={id:uid(),cat:"REFERENCE",source:"upload",approval:"approved",tags:["مرجع"],created:Date.now(),...r}; DB.assets.push(a); S.wiz.it.sourceAsset=a.id; save(); render(); return; }
  if(kind==="asset"){ const a={id:uid(),cat:$("#up-cat").value,source:"upload",approval:"pending",tags:[],created:Date.now(),...r}; DB.assets.push(a); save(); render(); toast("رُفع الأصل"); return; }
  if(kind==="scene"){ const it=cur(),i=+e.target.dataset.i; const a={id:uid(),cat:"REELS",source:"upload",approval:"pending",tags:[FAM[it.family].ar,`مشهد ${i+1}`],created:Date.now(),lineage:{contentId:it.id,scene:i,provider:"MANUAL_CLAUDE"},...r}; DB.assets.push(a); it.scenes=it.scenes||[]; it.scenes[i]={status:"GENERATED",assetId:a.id}; save(); render(); return; }
  if(kind==="gen"){ const it=cur(); if(!it.prompts.length) it.prompts.push({v:1,text:buildPrompt(it),date:Date.now()});
    const pv=it.prompts.slice(-1)[0];
    const a={id:uid(),cat:"GENERATED",source:"generated",approval:"pending",tags:[FAM[it.family].ar,FORMATS[it.format].ar,it.char.required?it.char.exp:"بدون شخصية"],prompt:pv.text,created:Date.now(),...r};
    it.jobs=it.jobs||[]; const job={localId:uid(),id:"manual-"+uid(),status:"COMPLETED",provider:"MANUAL_CLAUDE",cost_mode:"EXISTING_SUBSCRIPTION_MANUAL",promptV:pv.v,prompt_version_id:`${it.id}:v${pv.v}`,scene:null,parameters:{aspectRatio:FORMATS[it.format].ar_,variations:1},created_at:new Date().toISOString(),completed_at:new Date().toISOString(),ingested:true,output_assets:[]};
    job.creative=creativeSnapshot(it); it.jobs.push(job); a.lineage={jobId:job.id,promptVersion:pv.v,contentId:it.id,provider:"MANUAL_CLAUDE",model:"external",costMode:job.cost_mode,characterRef:null,creative:job.creative};
    DB.assets.push(a); it.generations.push({n:it.generations.length+1,promptV:pv.v,assetId:a.id,status:"review",feedback:[],checks:{},date:Date.now(),jobId:job.id,variation:1});
    it.status="IN_REVIEW"; save(); render(); toast(r.volatile?"رُفع الفيديو (لن يُحفظ بعد إعادة التحميل)":"رُفع الأصل. ابدأ المراجعة"); }
}
