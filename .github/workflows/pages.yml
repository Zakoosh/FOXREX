# Publish only the public site. Internal files (worker/, docs/, tools/, scripts/, README.md, SECURITY.md, GENERATION.md,
# VERIFICATION.md) stay in the repository. Takes effect only after Settings -> Pages -> Source = "GitHub Actions".
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the public site only
        run: |
          mkdir _site
          cp -r index.html 404.html CNAME robots.txt sitemap.xml site.webmanifest .nojekyll \
                about analysis ar assets contact data gold learn markets news privacy \
                risk-disclosure signals styles terms studio foxrex-studio.html _site/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
